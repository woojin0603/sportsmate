spring:
  datasource:
    url: ${SPORTMAP_LOCAL_DB_URL:jdbc:h2:file:./backend/sportmap-local;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false
app:
  admin:
    seed-enabled: true
    initial-password: ${ADMIN_INITIAL_PASSWORD:admin1234!}
  mail:
    mode: ${EMAIL_MODE:mock}
  auth:
    secure-cookie: false
  demo:
    enabled: false
server:
  address: 127.0.0.1
