spring:
  config:
    import: optional:file:./config/submission-secrets.properties
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/sportmap_submission?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:sportmap_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      validation-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  h2:
    console:
      enabled: false

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  shutdown: graceful

app:
  auth:
    secure-cookie: ${SECURE_COOKIE:false}
  admin:
    seed-enabled: ${ADMIN_SEED_ENABLED:true}
  mail:
    mode: ${EMAIL_MODE:mock}
  sms:
    mode: ${SMS_MODE:mock}
  demo:
    enabled: true
