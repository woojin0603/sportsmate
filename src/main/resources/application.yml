spring:
  config:
    # 로컬 비밀 설정은 실행 프로필과 관계없이 프로젝트 루트에서 읽는다.
    import: optional:file:./config/local-secrets.properties
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Seoul
server:
  forward-headers-strategy: framework
  error:
    include-message: always
app:
  admin:
    seed-enabled: ${ADMIN_SEED_ENABLED:false}
    initial-password: ${ADMIN_INITIAL_PASSWORD:}
  sms:
    mode: ${SMS_MODE:disabled}
    daily-limit: ${SMS_DAILY_LIMIT:100}
  mail:
    mode: ${EMAIL_MODE:disabled}
    public-base-url: ${MAIL_PUBLIC_BASE_URL:}
    from: ${MAIL_FROM:}
  auth:
    jwt-secret: ${JWT_SECRET:}
    secure-cookie: true
  import-key: ${IMPORT_KEY:}
  public-facility:
    url: ${PUBLIC_FACILITY_API_URL:https://apis.data.go.kr/B551014/SRVC_API_SFMS_FACI/TODZ_API_SFMS_FACI}
    service-key: ${PUBLIC_FACILITY_SERVICE_KEY:}
