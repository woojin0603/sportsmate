// 저장소 루트에서 자주 쓰는 백엔드 작업을 실행할 수 있게 위임한다.
tasks.register('bootRun') {
    group = 'application'
    description = 'Runs the Spring Boot backend.'
    dependsOn gradle.includedBuild('backend').task(':bootRun')
}

tasks.register('test') {
    group = 'verification'
    description = 'Runs backend tests.'
    dependsOn gradle.includedBuild('backend').task(':test')
}

tasks.register('buildBackend') {
    group = 'build'
    description = 'Builds the Spring Boot backend.'
    dependsOn gradle.includedBuild('backend').task(':build')
}

tasks.register('clean') {
    group = 'build'
    description = 'Cleans backend build outputs.'
    dependsOn gradle.includedBuild('backend').task(':clean')
}
